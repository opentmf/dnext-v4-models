openapi: 3.1.0
info:
  title: Orbitant Service Catalog Management API
  description: "## TMF API Reference: TMF633 - Service Catalog Management\n\n Version 4.0 \n\nThe Service Catalog API is one\
    \ of Catalog Management API Family.Service Catalog API goal is to provide a catalog of services. \nService Catalog API\
    \ performs the following operations on the resource :\n- Retrieve an entity or a collection of entities depending on filter\
    \ criteria\n- Partial update of an entity (including updating rules)\n- Create an entity (including default values and\
    \ creation rules)\n- Delete an entity (for administration purposes)\n- Manage notification of events."
  contact:
    name: PiA(people in action)
    url: http://www.pia-team.com/
    email: info@pia-team.com
  license:
    name: PiA License
    url: http://www.pia-team.com
  version: Version v4 (prepared with Service Catalog Management API REST Specification TMF633 Release 18.5.1)
