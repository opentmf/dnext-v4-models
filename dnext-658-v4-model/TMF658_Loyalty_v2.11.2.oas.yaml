          description: An aggregation, migration, substitution, dependency or exclusivity relationship between/among Specification
            Characteristics.
          items:
            $ref: '#/components/schemas/ProductSpecificationCharacteristicRelationship'
        productSpecCharacteristicValue:
          type: array
          description: A ProductSpecificationCharacteristicValue object is used to define a set of attributes, each of which
            can be assigned to a corresponding set of attributes in a ProductSpecificationCharacteristic object. The values
            of the attributes in the ProductSpecificationCharacteristicValue object describe the values of the attributes
            that a corresponding ProductSpecificationCharacteristic object can take on.
          items:
            $ref: '#/components/schemas/CharacteristicValueSpecification'
