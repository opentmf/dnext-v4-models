    LoyaltyRuleUpdate:
      type: object
      description: The LoyaltyRule to be updated
      properties:
        cnf:
          type: boolean
        mandatoryEvaluation:
          type: boolean
        commonName:
          type: string
          description: A user-friendly identifier of the loyalty rule.
        description:
          type: string
          description: A free-form description of the rule.
        isCNF:
          type: boolean
          description: This is a Boolean attribute that, if true, defines the condition clause of this rule to be represented
            in Conjunctive Normal Form (e.g., an AND of ORs). If the value of this attribute is false, then the condition
            clause will be represented in Disjunctive Normal Form (e.g., an OR of ANDs).
        isMandatoryEvaluation:
          type: boolean
          description: A Boolean attribute that, if true, signifies that evaluation (and possibly action execution) of this
            entity is mandatory and must be attempted. If the Mandatory property value of this entity is false, then the evaluation
            of this entity is considered to be 'best effort' and may be ignored.
        keywords:
          type: string
          description: A string attribute that defines a set of one or more keywords that a policy administrator may use to
            assist in characterizing or categorizing a policy object to facilitate search operations.
        policyName:
          type: string
          description: A generic naming attribute that can be used to identify different policy entities.
        usage:
          type: string
          description: A free-form string attribute that recommends how this policy object should be used.
        loyaltyAction:
          type: array
          description: References to linked actions.
          items:
            $ref: '#/components/schemas/LoyaltyActionRef'
        loyaltyCondition:
          type: array
          description: References to linked conditions.
          items:
            $ref: '#/components/schemas/LoyaltyConditionRef'
        loyaltyEventType:
          type: array
          description: References to linked event types.
          items:
            $ref: '#/components/schemas/LoyaltyEventTypeRef'
        subRule:
          type: array
          description: References to sub-rules
          items:
            $ref: '#/components/schemas/LoyaltyRule'
    JsonPatch:
      description: The LoyaltyAccount to be updated
    LoyaltyProgramProductSpecUpdate:
      type: object
      description: The LoyaltyProgramProductSpec to be updated
      properties:
        brand:
          type: string
          description: The manufacturer or trademark of the specification.
        description:
          type: string
          description: A narrative that explains in detail what the product specification is.
        isBundle:
          type: boolean
          description: isBundle determines whether a productSpecification represents a single productSpecification (false),
            or a bundle of productSpecification (true).
        lastUpdate:
          type: string
          format: date-time
          description: Date and time of the last update
        lifeCycleStatus:
          type: string
          description: The condition of the product specification, such as active, inactive, planned.
        lifecycleStatus:
          type: string
          description: Used to indicate the current lifecycle status
        name:
          type: string
          description: The name of the product specification.
        productNumber:
          type: string
        version:
          type: string
          description: Product specification version
        attachment:
          type: array
          description: Complements the description of an element (for instance a product) through video, pictures...
          items:
            $ref: '#/components/schemas/AttachmentRefOrValue'
        bundledProductSpecification:
          type: array
          description: A type of ProductSpecification that belongs to a grouping of ProductSpecifications made available to
            the market. It inherits of all attributes of ProductSpecification.
          items:
            $ref: '#/components/schemas/BundledProductSpecification'
        loyaltyRule:
          type: array
          description: Collection of Rules.
          items:
            $ref: '#/components/schemas/LoyaltyRule'
        productSpecCharacteristic:
          type: array
          description: A characteristic quality or distinctive feature of a ProductSpecification.  The characteristic can
            be take on a discrete value, such as color, can take on a range of values, (for example, sensitivity of 100-240
            mV), or can be derived from a formula (for example, usage time (hrs) = 30 - talk time *3). Certain characteristics,
            such as color, may be configured during the ordering or some other process.
          items:
            $ref: '#/components/schemas/ProductSpecificationCharacteristic'
        productSpecificationRelationship:
          type: array
          description: A migration, substitution, dependency or exclusivity relationship between/among product specifications.
          items:
            $ref: '#/components/schemas/ProductSpecificationRelationship'
        relatedParty:
          type: array
          description: A related party defines party or party role linked to a specific entity.
          items:
            $ref: '#/components/schemas/RelatedParty'
        resourceSpecification:
          type: array
          description: The ResourceSpecification is required to realize a ProductSpecification.
          items:
            $ref: '#/components/schemas/ResourceSpecificationRef'
        serviceSpecification:
          type: array
          description: ServiceSpecification(s) required to realize a ProductSpecification.
          items:
            $ref: '#/components/schemas/ServiceSpecificationRef'
        targetProductSchema:
          $ref: '#/components/schemas/TargetProductSchema'
          description: A target product schema reference. The reference object to the schema and type of target product which
            is described by product specification.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period for which the product specification is valid
