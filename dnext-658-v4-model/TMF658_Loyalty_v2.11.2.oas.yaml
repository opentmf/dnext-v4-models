          type: string
          description: A user-friendly identifier of the loyalty rule.
        description:
          type: string
          description: A free-form description of the rule.
        isCNF:
          type: boolean
          description: This is a Boolean attribute that, if true, defines the condition clause of this rule to be represented
            in Conjunctive Normal Form (e.g., an AND of ORs). If the value of this attribute is false, then the condition
            clause will be represented in Disjunctive Normal Form (e.g., an OR of ANDs).
        isMandatoryEvaluation:
          type: boolean
          description: A Boolean attribute that, if true, signifies that evaluation (and possibly action execution) of this
            entity is mandatory and must be attempted. If the Mandatory property value of this entity is false, then the evaluation
            of this entity is considered to be 'best effort' and may be ignored.
