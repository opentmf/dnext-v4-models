    TaxExemptionCertificate:
      type: object
      description: A tax exemption certificate represents a tax exemption granted to a party (individual or organization)
        by a tax jurisdiction which may be a city, state, country,... An exemption has a certificate identifier (received
        from the jurisdiction that levied the tax) and a validity period. An exemption is per tax types and determines for
        each type of tax what portion of the tax is exempted (partial by percentage or complete) via the tax definition.
      properties:
        id:
          type: string
          description: Identifier of the tax exemption within list of the exemptions
        certificateNumber:
          type: string
          description: Identifier of a document that shows proof of exemption from taxes for the taxing jurisdiction
        issuingJurisdiction:
          type: string
          description: Name of the jurisdiction that issued the exemption
          example: USA
        reason:
          type: string
          description: Reason for the tax exemption
        attachment:
          $ref: '#/components/schemas/AttachmentRefOrValue'
          description: The actual certificate contents, if such is supplied by the issuing jurisdiction
        taxDefinition:
          type: array
          description: A list of taxes that are covered by the exemption, e.g. City Tax, State Tax. The definition would include
            the exemption (e.g. for a rate exemption 0% would be a full exemption, 5% could be a partial exemption if the
            actual rate was 10%).
          items:
            $ref: '#/components/schemas/TaxDefinition'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period of time for which the exemption is valid
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        endDateTime:
          type: string
          format: date-time
          description: End of the time period, using IETC-RFC-3339 format
          example: 1985-04-12 23:20:50.520000+00:00
        startDateTime:
          type: string
          format: date-time
          description: Start of the time period, using IETC-RFC-3339 format
          example: 1985-04-12 23:20:50.520000+00:00
