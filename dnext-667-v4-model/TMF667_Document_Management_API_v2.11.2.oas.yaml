components:
  schemas:
    EventSubscriptionInput:
      type: object
      description: Data containing the callback endpoint to deliver the information
      properties:
        callback:
          type: string
          description: The callback being registered.
          minLength: 1
        query:
          type: string
          description: additional data to be passed
      required:
      - callback
    EventSubscription:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      properties:
        revision:
          type: integer
          description: Version number of the entity
        createdDate:
          type: string
          format: date-time
          description: Date of creation
        updatedDate:
          type: string
          format: date-time
          description: Date of update
        createdBy:
          type: string
          description: Name of created by user
        updatedBy:
          type: string
          description: Name of updated by user
        id:
          type: string
          description: Id of the listener
          minLength: 1
        callback:
          type: string
          description: The callback being registered.
          minLength: 1
        query:
          type: string
          description: additional data to be passed
      required:
      - callback
      - id
    Error:
      type: object
      properties:
        code:
          type: string
        reason:
          type: string
        message:
          type: string
        status:
          type: string
        referenceError:
          type: string
          format: uri
        baseType:
          type: string
        schemaLocation:
          type: string
        type:
          type: string
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference. For AttachmentRefOrValue, the attribute type,schemaLocation and
        referredType are related to the contained entity and not to AttchmentRefOrValue itself
      properties:
        id:
          type: string
          description: Unique identifier for this particular attachment
          example: 3a2203b8-0d79-4e02-bc51-3deaf0afa684
        href:
          type: string
          format: uri
          description: URI for this Attachment
          example: https://serverRoot/api/documentManagement/v4/attach1.mp4
        attachmentType:
          type: string
          description: Attachment type such as video, picture
          example: video
        description:
          type: string
          description: A narrative text describing the content of the attachment
          example: This is test mp4 file
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and document
          example: mp4
        name:
          type: string
          description: The name of the attachment
          example: attach1
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
          example: https://serverRoot/api/documentManagement/v4/attachment
        size:
          $ref: '#/components/schemas/Quantity'
          description: The size of the attachment.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period of time for which the attachment is valid
        category:
          type: array
          description: Reference to the category. A set of classifications for the attachment types.
          items:
            $ref: '#/components/schemas/CategoryRef'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
          example: Attachment
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
          example: https://serverRoot/api/documentManagement/v4/attachmentRefOrValue
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
          example: AttachmentRefOrValue
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
          example: https://serverRoot/api/documentManagement/v4/attachmentRefOrValue
    CategoryRef:
      type: object
      description: The category for grouping recommendations
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
          example: d43cf304-b8a3-4657-a269-11370a0d311c
        href:
          type: string
          format: uri
          description: Reference of the related entity.
          example: https://serverRoot/api/documentManagement/v4/categoryRef
        name:
          type: string
          description: Name of the related entity.
          example: CategoryRef
        version:
          type: string
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
          example: Document
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
          example: https://serverRoot/api/documentManagement/v4/categoryRef
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
          example: CategoryRef
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
          example: Document
      required:
      - id
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a name/value pair.
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
          example: 112ddb43-6db9-471b-882e-78475a604b28
        name:
          type: string
          description: Name of the characteristic
          example: DocumentCharacteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
          example: string
        characteristicRelationship:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicRelationship'
        value:
