components:
  schemas:
    AccountRef:
      type: object
      description: Account reference. A account may be a party account or a financial account.
      properties:
        id:
          type: string
          description: Unique identifier of the account
        href:
          type: string
          format: uri
          description: Reference of the account
        description:
          type: string
          description: Detailed description of the account
        name:
          type: string
          description: Name of the account
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - id
    ChannelRef:
      type: object
      description: The channel to which the resource reference to. e.g. channel for selling product offerings, channel for
        opening a trouble ticket etc..
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the channel.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - id
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a name/value pair.
      properties:
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        value:
          description: The value of the characteristic
          $ref: '#/components/schemas/Any'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - name
      - value
    Money:
      type: object
      description: A base / value business entity used to represent money
      properties:
        unit:
          type: string
          description: Currency (ISO4217 norm uses 3 letters to define the currency)
        value:
          type: number
          format: float
          description: A positive floating point number
      required:
      - unit
      - value
    PaymentMethodRefOrValue:
      type: object
      description: link to the resource that holds information about the payment mean used to complete the operation
      properties:
        id:
          type: string
          description: Unique Identifier within the server for the payment method.
        href:
          type: string
          format: uri
          description: A resource URI pointing to the resource in the server that stores the detailed information. This is
            typically the resource url to retrieve individual details for the specific payment method
        description:
          type: string
          description: Text describing the contents of the payment method
        isPreferred:
          type: boolean
          description: If the method is the preferred one by the owner. Typically used when querying for the payment methods
            of a specific customer or account
        name:
          type: string
          description: Friendly name assigned to the payment method
        status:
          type: string
        statusDate:
          type: string
          format: date-time
        account:
          type: array
          items:
            $ref: '#/components/schemas/AccountRef'
        relatedParty:
          $ref: '#/components/schemas/RelatedParty'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: Date interval in which the payment method is valid
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
    PaymentRef:
      type: object
      description: If an immediate payment has been done at the product order submission, the payment information are captured
        and stored (as a reference) in the order.
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: A name for the payment
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - id
    Refund:
      type: object
      description: The Refund resource represents a performed Refund. It contains both information about the refund and the
        payment method used to perform it.
      properties:
        revision:
          type: integer
          description: Version number of the entity
        createdDate:
          type: string
          format: date-time
          description: Date of creation
        updatedDate:
          type: string
          format: date-time
          description: Date of update
        createdBy:
          type: string
          description: Name of created by user
        updatedBy:
          type: string
          description: Name of updated by user
        id:
          type: string
          description: Unique identifier of Refund
        href:
          type: string
          format: uri
          description: Hypertext Reference of the refund
        authorizationCode:
          type: string
          description: Authorization code retrieved from an external payment gateway that could be used for conciliation
        correlatorId:
          type: string
          description: Unique identifier in the client for the refund in case it is needed to correlate
        description:
          type: string
          description: Text describing the contents of the refund
        name:
          type: string
          description: Screen name of the refund
        refundDate:
          type: string
          format: date-time
          description: Date when the refund was performed
        status:
          type: string
          description: Status of the refund
        statusDate:
          type: string
          format: date-time
          description: Date when the status was recorded
        account:
          $ref: '#/components/schemas/AccountRef'
        amount:
          $ref: '#/components/schemas/Money'
          description: Amount to be refunded (net of taxes)
        channel:
          $ref: '#/components/schemas/ChannelRef'
        payment:
          $ref: '#/components/schemas/PaymentRef'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodRefOrValue'
        requestor:
          $ref: '#/components/schemas/RelatedParty'
        taxAmount:
          $ref: '#/components/schemas/Money'
          description: Tax applied
        totalAmount:
          $ref: '#/components/schemas/Money'
          description: Amount to be paid (including taxes)
        characteristic:
          type: array
          description: A list of characteristics
          items:
            $ref: '#/components/schemas/Characteristic'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
