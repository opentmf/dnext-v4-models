components:
  schemas:
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference. For AttachmentRefOrValue, the attribute type,schemaLocation and
        referredType are related to the contained entity and not to AttchmentRefOrValue itself
      properties:
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        id:
          type: string
          description: Unique identifier for this particular attachment
        href:
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          description: The actual contents of the attachment object, if embedded, encoded as base64
          format: base64
        description:
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: '#/components/schemas/Quantity'
          description: The size of the attachment.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period of time for which the attachment is valid
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a name/value pair.
      properties:
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        id:
          type: string
          description: Unique identifier of the characteristic
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        characteristicRelationship:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicRelationship'
        value:
          description: The value of the characteristic
          $ref: '#/components/schemas/Any'
      required:
      - name
      - value
    CharacteristicRelationship:
      type: object
      description: Another Characteristic that is related to the current Characteristic;
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        relationshipType:
          type: string
          description: The type of relationship
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
    ConstraintRef:
      type: object
      description: Constraint reference. The Constraint resource represents a policy/rule applied to an entity or entity spec.
      properties:
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        id:
          type: string
          description: reference id to the target constraint
        href:
          type: string
          format: uri
          description: Hyperlink reference to the target constraint
        name:
          type: string
          description: Name given to the constraint
        version:
          type: string
          description: constraint version
        '@referredType':
          type: string
          description: The (class) type of the referred constraint
      required:
      - id
    ExternalReference:
      type: object
      description: External reference of the individual or reference in other system
      properties:
        id:
          type: string
          description: External reference id
        href:
          type: string
          format: uri
        externalReferenceType:
          type: string
          description: Type of the external reference
        name:
          type: string
          description: External reference name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - name
    Feature:
      type: object
      description: Configuration feature.
      properties:
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        id:
          type: string
          description: Unique identifier of the feature.
        isBundle:
          type: boolean
          description: True if this is a feature group. Default is false.
        isEnabled:
          type: boolean
          description: True if this feature is enabled. Default is true.
        name:
          type: string
          description: This is the name for the feature.
        constraint:
          type: array
          description: This is a list of feature constraints.
          items:
            $ref: '#/components/schemas/ConstraintRef'
        featureCharacteristic:
          type: array
          description: This is a list of Characteristics for a particular feature.
          items:
            $ref: '#/components/schemas/Characteristic'
          maxItems: 2147483647
          minItems: 1
        featureRelationship:
          type: array
          items:
            $ref: '#/components/schemas/FeatureRelationship'
        featureBundle:
          type: array
          description: Bundled feature specification
          items:
            $ref: '#/components/schemas/FeatureBundle'
      required:
      - featureCharacteristic
      - name
    FeatureBundle:
      type: object
      description: A type of FeatureSpecification that belongs to a grouping of FeatureSpecifications made available to the
        market. It inherits of all attributes of FeatureSpecification.
      properties:
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        href:
          type: string
          format: uri
          description: Unique reference of the FeatureBundle
        id:
          type: string
          description: Unique identifier of the FeatureBundle
        lifecycleStatus:
          type: string
          description: Used to indicate the current lifecycle status
        name:
          type: string
          description: Name of the FeatureBundle
    FeatureRelationship:
      type: object
      description: Configuration feature
      properties:
        id:
          type: string
          description: Unique identifier of the target feature.
        name:
          type: string
          description: This is the name of the target feature.
        relationshipType:
          type: string
          description: This is the type of the feature relationship.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period for which this feature relationship is valid.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - name
      - relationshipType
    GeographicLocationRefOrValue:
      type: object
      description: A GeographicLocation is a pure-virtual super-class to the GeoJSON-aligned geometries of Point (addresses
        and locations), MultiPoint, LineString (streets, highways and boundaries), MultiLineString and Polygon (countries,
        provinces, tracts of land). Use the @type attribute to specify which of these is being specified by the geometry attribute.
      properties:
        id:
          type: string
          description: Unique identifier of the place
        href:
          type: string
          format: uri
          description: Unique reference of the place
        name:
          type: string
          description: A user-friendly name for the place, such as [Paris Store], [London Store], [Main Home]
        bbox:
          type: array
          description: A bounding box array that contains the geometry. The axes order follows the axes order of the geometry
          items:
            type: number
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - '@type'
    GeographicSubAddress:
      type: object
      description: Representation of a GeographicSubAddress  It is used for addressing within a property in an urban area
        (country properties are often defined differently). It may refer to a building, a building cluster, or a floor of
        a multistory building.
      properties:
        id:
          type: string
          description: Unique Identifier of the subAddress
        href:
          type: string
          format: uri
          description: Link to the subAddress
        buildingName:
          type: string
          description: allows for buildings that have well-known names
        levelNumber:
          type: string
          description: used where a level type may be repeated e.g. BASEMENT 1, BASEMENT 2
        levelType:
          type: string
          description: describes level types within a building
        name:
          type: string
          description: Name of the subAddress to identify it with a meaningful identification
        privateStreetName:
          type: string
          description: private streets internal to a property (e.g. a university) may have internal names that are not recorded
            by the land title office.
        privateStreetNumber:
          type: string
          description: private streets numbers internal to a private street
        subAddressType:
          type: string
          description: 'Type of subAddress : it can be a subunit or a private street'
        subUnitNumber:
          type: string
          description: the discriminator used for the subunit often just a simple number e.g. FLAT 5, may also be a range
        subUnitType:
          type: string
          description: the type of subunit e.g.BERTH, FLAT, PIER, SUITE, SHOP, TOWER, UNIT, WHARF
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
    LogicalResourceCreate:
      allOf:
