components:
  schemas:
    AccountBalance:
      type: object
      description: Balances linked to the account
      properties:
        balanceType:
          type: string
          description: ' Type of the balance : deposit balance, disputed balance, loyalty balance, receivable balance...'
        amount:
          $ref: '#/components/schemas/Money'
          description: Balance amount
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: ' Balance validity period.'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - amount
      - balanceType
      - validFor
    AccountRef:
      type: object
      description: Account reference. A account may be a party account or a financial account.
      properties:
        id:
          type: string
        href:
          type: string
          format: uri
          description: Reference of the resource
        description:
          type: string
          description: Detailed description of the account.
        name:
          type: string
          description: Name of the account.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation
    AccountRelationship:
      type: object
      description: Significant connection between accounts. For instance an aggregating account for a list of shop branches
        each having its own billing account.
      properties:
        accountRef:
          $ref: '#/components/schemas/AccountRef'
          description: An account reference (AccountRef). A account may be a party account or a financial account.
        relationshipType:
          type: string
          description: Type of relationship.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: Validity period of that relationship.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - relationshipType
      - validFor
    AccountTaxExemption:
      type: object
      description: Proof of freedom from taxes imposed by a taxing jurisdiction
      properties:
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: Period for which the exemption is valid.
        certificateNumber:
          type: string
          description: Identifier of a document that shows proof of exemption from taxes for the taxing jurisdiction.
        issuingJurisdiction:
          type: string
          description: ' Name of the taxing jurisdiction for which taxes are exempt.'
        reason:
          type: string
          description: Reason of the tax exemption.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - issuingJurisdiction
      - validFor
    AclRelatedParty:
      type: object
      description: Related Entity reference. A ACL related party defines party or party role linked to a specific entity.
      properties:
        id:
          type: string
          description: Unique identifier of the related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        role:
          type: string
          description: Role played by the related party
        name:
          type: string
          description: Name of the related entity.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - '@referredType'
      - id
    AttachmentRefOrValue:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of a attachment.
        href:
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          description: The actual contents of the attachment object, if embedded, encoded as base64
        description:
          type: string
          description: A narrative text describing the content of the attachment
        documentType:
          type: string
          description: The type of the document
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: '#/components/schemas/Quantity'
          description: The size of the attachment.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        '@baseType':
