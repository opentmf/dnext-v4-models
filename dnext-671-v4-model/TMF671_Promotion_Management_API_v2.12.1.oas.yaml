components:
  schemas:
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference. An attachment complements the description of an element, for example
        through a document, a video, a picture.
      properties:
        id:
          type: string
          description: Unique identifier for this particular attachment
          example: 4aafacbd-11ff-4dc8-b445-305f2215715f
        href:
          type: string
          format: uri
          description: URI for this Attachment
          example: http://host/Attachment/4aafacbd-11ff-4dc8-b445-305f2215715f
        attachmentType:
          type: string
          description: Attachment type such as video, picture
          example: video
        content:
          type: string
          description: The actual contents of the attachment object, if embedded, encoded as base64
          format: base64
        description:
          type: string
          description: A narrative text describing the content of the attachment
          example: Photograph of the Product
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
          example: http://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f
        size:
          $ref: '#/components/schemas/Quantity'
          description: The size of the attachment.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period of time for which the attachment is valid
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
    EntityRef:
      type: object
      description: Entity reference schema to be use for all entityRef class.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        name:
          type: string
          description: Name of the related entity.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - id
    PromotionAction:
      type: object
      description: Action of the promotion. When the customer meets the conditions in the promotion pattern, the customer
        can be given the benefits in the action.
      properties:
        id:
          type: string
          description: Unique identifier.
        actionType:
          type: string
          description: 'Action type can be one of the following: voice (minute), data (MB), data (GB), SMS, bonus point, physical
            gift, voucher, promotion code, an existing offering, currency.'
          minLength: 1
        actionValue:
          type: string
          description: 'When the Promotion type is 1: Award, it means the amount or value of the awards decided by actionType,
            such as: Amount of gift, Amount of bonus, Value of discount;    • When the Promotion type is 2: Discount, it means
            the value of the discount;    • When the Promotion type is 3: reduction, it means the value of the reduced money.'
        actionEntityRef:
          $ref: '#/components/schemas/EntityRef'
          description: 'It refers to the entity which is impacted by the promotion action.   • When the Promotion type is
            1: Award, the actionEntityRef is the party account;   • When the Promotion type is 2: Discount, it is the product
            offering;   • When the Promotion type is 3: Reduction, it is the product offering also.'
        '@baseType':
          type: string
          description: The base type for use in polymorphic collections
        '@schemaLocation':
          type: string
          format: uri
          description: A link to the schema describing a resource (for type extension).
        '@type':
          type: string
          description: The class type of the actual resource (for type extension).
      required:
      - actionType
    PromotionCreate:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for the activity record
        description:
          type: string
          description: Details about the purpose of this promotion.
        lastUpdate:
          type: string
          format: date-time
          description: Latest update date of promotion.
        lifecycleStatus:
          type: string
          description: 'Value of promotion status. Our suggestion would be: draft/test/waitForApproval/release/suspend/retirement.'
        name:
          type: string
          description: Name of promotion.
        promotionType:
          type: string
          description: Type of promotion. The basic type are Award/Discount/Reduction.
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRefOrValue'
        pattern:
          type: array
          items:
            $ref: '#/components/schemas/PromotionPattern'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period for which the promotion is valid.
        '@baseType':
          type: string
          description: The base type for use in polymorphic collections.
        '@schemaLocation':
          type: string
          format: uri
          description: A link to the schema describing a resource (for type extension).
        '@type':
          type: string
          description: The class type of the actual resource (for type extension).
      required:
      - name
    PromotionCriteria:
      type: object
      description: Set of criteria to be followed by all parties.
      properties:
        id:
          type: string
          description: Unique identifier.
        criteriaOperator:
          type: string
          description: 'Logic operator of this criteria instruction: ''='' or ''>'' or ''<'' or ''>='' or ''<='' or ''<>''.'
          minLength: 1
        criteriaParameter:
          type: string
          description: The parameter (factor) of the criteria.The basic factors are abstracted from these data sources.There
            are several detail parameters.
          minLength: 1
        criteriaValue:
          type: string
          description: The value is filled for the comparison of the criteria.
          minLength: 1
        '@baseType':
          type: string
          description: The base type for use in polymorphic collections
        '@schemaLocation':
          type: string
          format: uri
          description: A link to the schema describing a resource (for type extension).
        '@type':
          type: string
          description: The class type of the actual resource (for type extension).
      required:
      - criteriaOperator
      - criteriaParameter
      - criteriaValue
    PromotionCriteriaGroup:
      type: object
      description: Set of group criteria to promotion. Fulfilling these criteria, parties will receice benefits
      properties:
        id:
          type: string
          description: Unique Identifier
        criteriaLogicalRelationship:
          type: string
          description: Logical relation followed by all criteria.
        groupName:
          type: string
          description: Name of the group to be easily identified
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/PromotionCriteria'
        '@baseType':
          type: string
          description: The base type for use in polymorphic collections
        '@schemaLocation':
          type: string
          format: uri
          description: A link to the schema describing a resource (for type extension).
        '@type':
          type: string
          description: The class type of the actual resource (for type extension).
      required:
      - criteria
    PromotionPattern:
      type: object
      description: Contains the conditions and benefits of the promotion toan eligible party
      properties:
        id:
          type: string
          description: Unique identifier of promotion pattern.
        criteriaGroupLogicalRelationship:
          type: string
          description: Logical relation followed by the criteria group.
        description:
          type: string
          description: Small description to clarify the pattern details.
        name:
          type: string
          description: Alias to promotion pattern. This way is easily mentioned.
        priority:
          type: integer
          description: Priority. Smaller number means high.
        action:
          type: array
          items:
            $ref: '#/components/schemas/PromotionAction'
        criteriaGroup:
          type: array
          items:
            $ref: '#/components/schemas/PromotionCriteriaGroup'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period  for which the promotion pattern is valid.
        '@baseType':
          type: string
          description: The base type for use in polymorphic collections
        '@schemaLocation':
          type: string
          format: uri
          description: A link to the schema describing a resource (for type extension).
        '@type':
          type: string
          description: The class type of the actual resource (for type extension).
      required:
      - action
      - criteriaGroup
    Quantity:
      type: object
      description: An amount in a given unit
      properties:
        amount:
          type: number
          format: float
          description: Numeric value in a given unit
        units:
          type: string
          description: Unit
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        endDateTime:
          type: string
          format: date-time
          description: End of the time period, using IETC-RFC-3339 format
          example: 1985-04-12 23:20:50.520000+00:00
        startDateTime:
          type: string
          format: date-time
          description: Start of the time period, using IETC-RFC-3339 format
          example: 1985-04-12 23:20:50.520000+00:00
    Promotion:
      type: object
      description: Promotion is used to provide the additional discount, voucher, bonus or gift to the customer who meets
        the pre-defined criteria. Using promotion, the enterprise is able to attract the users and encourage more consumption,
        especially continuous purchases. Normally Promotion is not regarded as one type of product or product offering. It
        is often applied when the customer buys the product offerings with the price or amount surpassing the certain limit.
      properties:
        revision:
          type: integer
          description: Version number of the entity
        createdDate:
          type: string
          format: date-time
          description: Date of creation
        updatedDate:
          type: string
          format: date-time
          description: Date of update
        createdBy:
          type: string
          description: Name of created by user
        updatedBy:
          type: string
          description: Name of updated by user
        id:
          type: string
          description: Unique identifier of promotion.
        href:
          type: string
          format: uri
          description: Hyperlink to access the promotion.
        description:
          type: string
          description: Details about the purpose of this promotion.
        lastUpdate:
          type: string
          format: date-time
          description: Latest update date of promotion.
        lifecycleStatus:
          type: string
          description: 'Value of promotion status. Our suggestion would be: draft/test/waitForApproval/release/suspend/retirement.'
        name:
          type: string
          description: Name of promotion.
        promotionType:
          type: string
          description: Type of promotion. The basic type are Award/Discount/Reduction.
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRefOrValue'
        pattern:
          type: array
          items:
            $ref: '#/components/schemas/PromotionPattern'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period for which the promotion is valid.
        '@baseType':
          type: string
          description: The base type for use in polymorphic collections.
        '@schemaLocation':
          type: string
          format: uri
          description: A link to the schema describing a resource (for type extension).
        '@type':
          type: string
          description: The class type of the actual resource (for type extension).
    Error:
      type: object
      properties:
        code:
          type: string
        reason:
          type: string
        message:
          type: string
        status:
          type: string
        referenceError:
          type: string
          format: uri
        baseType:
          type: string
        schemaLocation:
          type: string
        type:
          type: string
    EventSubscriptionInput:
      type: object
      description: Data containing the callback endpoint to deliver the information
      properties:
        callback:
          type: string
          description: The callback being registered.
          minLength: 1
        query:
          type: string
          description: additional data to be passed
      required:
      - callback
    EventSubscription:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      properties:
        revision:
          type: integer
          description: Version number of the entity
        createdDate:
          type: string
          format: date-time
          description: Date of creation
        updatedDate:
          type: string
          format: date-time
          description: Date of update
        createdBy:
          type: string
          description: Name of created by user
        updatedBy:
          type: string
          description: Name of updated by user
        id:
          type: string
          description: Id of the listener
          minLength: 1
        callback:
          type: string
          description: The callback being registered.
          minLength: 1
        query:
          type: string
          description: additional data to be passed
      required:
      - callback
      - id
    PromotionUpdate:
      type: object
      description: The Promotion to be updated
      properties:
        description:
          type: string
          description: Details about the purpose of this promotion.
        lastUpdate:
          type: string
          format: date-time
          description: Latest update date of promotion.
        lifecycleStatus:
          type: string
          description: 'Value of promotion status. Our suggestion would be: draft/test/waitForApproval/release/suspend/retirement.'
        name:
          type: string
          description: Name of promotion.
