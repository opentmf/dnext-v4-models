openapi: 3.1.0
info:
  title: Orbitant Promotion Management API
  description: '## TMF API Reference : TMF 671 - Promotion Management   Version 4.1.0  /Used to provide the additional discount,
    voucher, bonus or gift to the customer who meets the pre-defined criteria. Using promotion, the enterprise is able to
    attract the users and encourage more consumption, especially continuous purchases. Normally Promotion is not regarded
    as one type of product or product offering. It is often applied when the customer buys the product offerings with the
    price or amount surpassing the certain limit

    '
  contact:
    name: PiA(people in action)
    url: http://www.pia-team.com/
    email: info@pia-team.com
  license:
    name: PiA License
    url: http://www.pia-team.com
  version: Version null (prepared with Promotion Management API REST Specification TMF671)
servers:
- url: https://uat.test.orbitant.dev/api/promotionManagement/v1
  description: Generated server url
paths:
