components:
  schemas:
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference. For AttachmentRefOrValue,
        the attribute type,schemaLocation and referredType are related to the
        contained entity and not to AttchmentRefOrValue itself
      properties:
        id:
          type: string
          description: Unique identifier for this particular attachment
        href:
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          description: The actual contents of the attachment object, if embedded, encoded
            as base64
        description:
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and
            document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: "#/components/schemas/Quantity"
          description: The size of the attachment.
        validFor:
          $ref: "#/components/schemas/TimePeriod"
          description: The period of time for which the attachment is valid
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
    InteractionItem:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the interaction item
        creationDate:
          type: string
          format: date-time
          description: Date when the interaction item is created in the system
        reason:
          type: string
          description: Reason why this item is referred
        resolution:
          type: string
          description: Resolution of the interaction item
        attachment:
          type: array
          description: Complements the description of an element (for instance a product)
            through video, pictures...
          items:
            $ref: "#/components/schemas/AttachmentRefOrValue"
        channel:
          type: array
          description: "Where the interaction took place (e.g.: web, mobile app, store,
            kiosk, etc.)"
          items:
            $ref: "#/components/schemas/RelatedChannel"
        item:
          $ref: "#/components/schemas/RelatedEntityRefOrValue"
          description: RelatedEntity defines a reference to any entity. It uses
            polymorphism in order to let the API client know how to treat the
            element, as the entity type is not known beforehand.
        itemDate:
          $ref: "#/components/schemas/TimePeriod"
          description: Moment this item is referred
        note:
          type: array
          description: Extra information about a given entity
          items:
            $ref: "#/components/schemas/Note"
        relatedParty:
          type: array
          description: Related Entity reference. A related party defines party or party
            role linked to a specific entity.
          items:
            $ref: "#/components/schemas/RelatedParty"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    InteractionRelationship:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the referenced party interaction
        href:
          type: string
          format: uri
          description: Hyperlink to access the referenced party interaction
        relationshipType:
          type: string
          description: Type of the interaction relationship
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Note:
      type: object
      description: Extra information about a given entity
      properties:
        id:
          type: string
          description: Identifier of the note within its containing entity (may or may not
            be globally unique, depending on provider implementation)
        author:
          type: string
          description: Author of the note
        date:
          type: string
          format: date-time
          description: Date of the note
        text:
          type: string
          description: Text of the note
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    PartyInteractionCreate:
      type: object
      description: The PartyInteraction to be created
      properties:
        id:
          type: string
          description: Unique identifier of the customer
        creationDate:
          type: string
          format: date-time
          description: Date when the interaction is created in the system
        description:
          type: string
          description: Description of the interaction
        direction:
          type: string
          description: Specifies who started the interaction. It might be the party or the
            enterprise exposing this API. Possible descriptions are “inbound”
            and “outbound”
        reason:
          type: string
          description: Reason why the interaction happened
        status:
          type: string
          description: Status of the interaction (opened, inProgress, completed)
        statusChangeDate:
          type: string
          format: date-time
          description: Last time the status changed
        attachment:
          type: array
          description: Complements the description of an element (for instance a product)
            through video, pictures...
          items:
            $ref: "#/components/schemas/AttachmentRefOrValue"
        channel:
          type: array
          description: Where the interaction took place (e.g. web, mobile app, store,
            kiosk, etc.)
          items:
            $ref: "#/components/schemas/RelatedChannel"
        interactionDate:
          $ref: "#/components/schemas/TimePeriod"
          description: The period during which the interaction took place. Start and end
            will be different in case of a call or a store visit. They will be
            the same (or only one will appear) in case of a message or other
            momentary interactions.
        interactionItem:
          type: array
          description: A list of interaction items
          items:
            $ref: "#/components/schemas/InteractionItem"
        interactionRelationship:
          type: array
          description: A list of interaction relationships
          items:
            $ref: "#/components/schemas/InteractionRelationship"
        note:
          type: array
          description: Extra information about a given entity
          items:
            $ref: "#/components/schemas/Note"
        relatedParty:
          type: array
          description: Related Entity reference. A related party defines party or party
            role linked to a specific entity.
          items:
            $ref: "#/components/schemas/RelatedParty"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
        - channel
        - direction
        - interactionDate
        - reason
        - status
    Quantity:
      type: object
      description: An amount in a given unit
      properties:
        amount:
          type: number
          format: float
          description: Numeric value in a given unit
        units:
          type: string
          description: Unit
    RelatedChannel:
      type: object
      description: Related channel to another entity. May be online web, mobile app,
        social ,etc.
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the channel.
        role:
          type: string
          description: Role playing by the channel.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - href
        - id
    RelatedEntityRefOrValue:
      type: object
      description: A reference to an entity, where the type of the entity is not known
        in advance. A related entity defines a entity described by reference or
        by value linked to a specific entity. The polymorphic attributes @type,
        @schemaLocation & @referredType are related to the Entity and not the
        RelatedEntityRefOrValue class itself
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the related entity.
        role:
          type: string
          description: A string. Role playing by the related entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - role
    RelatedParty:
      type: object
      description: Related Entity reference. A related party defines party or party
        role linked to a specific entity.
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the related entity.
        role:
          type: string
          description: Role played by the related party
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - "@referredType"
        - href
        - id
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a
        startDateTime only, or both
      properties:
        endDateTime:
          type: string
          format: date-time
          description: End of the time period, using IETC-RFC-3339 format
        startDateTime:
          type: string
          format: date-time
          description: Start of the time period, using IETC-RFC-3339 format. If you define
            a start, you must also define an end
    PartyInteraction:
      type: object
      properties:
        revision:
          type: integer
          description: Version number of the entity
        createdDate:
          type: string
          format: date-time
          description: Date of creation
        updatedDate:
          type: string
          format: date-time
          description: Date of update
        createdBy:
          type: string
          description: Name of created by user
        updatedBy:
          type: string
          description: Name of updated by user
        id:
          type: string
          description: Unique identifier of the party interaction
        href:
          type: string
          format: uri
          description: Hyperlink to access the party interaction
        description:
          type: string
          description: Description of the interaction
        direction:
          type: string
          description: Specifies who started the interaction. It might be the party or the
            enterprise exposing this API. Possible values are “inbound” and
            “outbound”
        reason:
          type: string
          description: Reason why the interaction happened
        status:
          type: string
          description: Status of the interaction (opened, inProgress, completed)
        statusChangeDate:
          type: string
          format: date-time
          description: Last time the status changed
        attachment:
          type: array
          description: Complements the description of an element (for instance a product)
            through video, pictures...
          items:
            $ref: "#/components/schemas/AttachmentRefOrValue"
        channel:
          type: array
          description: Where the interaction took place (e.g. web, mobile app, store,
            kiosk, etc.)
          items:
            $ref: "#/components/schemas/RelatedChannel"
        interactionDate:
          $ref: "#/components/schemas/TimePeriod"
          description: The period during which the interaction took place. Start and end
            will be different in case of a call or a store visit. They will be
            the same (or only one will appear) in case of a message or other
            momentary interactions.
        interactionItem:
          type: array
          description: A list of interaction items
          items:
            $ref: "#/components/schemas/InteractionItem"
        interactionRelationship:
          type: array
          description: A list of interaction relationships
          items:
            $ref: "#/components/schemas/InteractionRelationship"
        note:
          type: array
          description: Extra information about a given entity
          items:
            $ref: "#/components/schemas/Note"
        relatedParty:
