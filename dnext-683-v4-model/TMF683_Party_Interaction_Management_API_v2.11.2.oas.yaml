openapi: 3.1.0
info:
  title: Dnext Party Interaction Management API
  description: Party Interaction captures information about past interactions in
    order to re-use it in future ones.
  termsOfService: https://www.gnu.org/licenses/agpl-3.0.en.html
  contact:
    name: PiA Bilisim Hizmetleri A.S. (DNext)
    url: https://www.pia-team.com/contact
    email: info@pia-team.com
  license:
    name: GNU AGPLv3
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: 4.6.2
servers:
  - url: https://uat.test.orbitant.dev/api/partyInteractionManagement/v4
    description: Generated server url
tags:
  - name: partyInteraction
    description: the partyInteraction API
  - name: hub
    description: the hub API
