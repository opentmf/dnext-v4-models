components:
  schemas:
    AccountRef:
      type: object
      description: Account reference. A account may be a party account or a financial account.
      properties:
        id:
          type: string
          description: Unique identifier of the account
        href:
          type: string
          format: uri
          description: Reference of the account
        description:
          type: string
          description: Detailed description of the account
        name:
          type: string
          description: Name of the account
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - id
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference. An attachment complements the description of an element, for example
        through a document, a video, a picture.
      properties:
        id:
          type: string
          description: Unique identifier for this particular attachment
        href:
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          description: The actual contents of the attachment object, if embedded, encoded as base64
          format: base64
        description:
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: '#/components/schemas/Quantity'
          description: The size of the attachment.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period of time for which the attachment is valid
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
    PaymentMethod:
      type: object
      description: Defines a specific method of payment (e.g. direct debit with all details associated)
      discriminator:
        propertyName: '@type'
      properties:
        revision:
          type: integer
          description: Version number of the entity
        createdDate:
          type: string
          format: date-time
          description: Date of creation
        updatedDate:
          type: string
          format: date-time
          description: Date of update
        createdBy:
          type: string
          description: Name of created by user
        updatedBy:
          type: string
          description: Name of updated by user
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        name:
          type: string
          description: Friendly name assigned to the payment method
        description:
          type: string
          description: Text description of the contents of the payment method
        isPreferred:
          type: boolean
          description: If the method is the preferred one by the owner. Typically used when querying for the payment methods
            of a specific customer or account
        authorizationCode:
          type: string
          description: 'Review: Authorization code provided by a financial institution. Typically this would be populated
            for recurring payments using the method, as payments have an authorization code of their own.'
        status:
          type: string
          description: Status of the payment method
        statusDate:
          type: string
          format: date-time
          description: The last time the payment method status changed.
        statusReason:
          type: string
          description: The reason for the last status change.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: Date interval in which the payment method is valid
        relatedParty:
          $ref: '#/components/schemas/RelatedParty'
          description: Reference to the customer or party that owns that payment method or can use it.
        relatedPlace:
          $ref: '#/components/schemas/RelatedPlace'
          description: Reference to a place for billing or delivery address, if different to that of the related party.
        account:
          type: array
          description: Reference to the accounts that are linked to the payment method. May be a party account or a financial
            account.
          items:
            $ref: '#/components/schemas/AccountRef'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: 'Type of payment method (e.g.: bank card, cash, voucher, etc). The details field type depends on the
            value assigned to this one.'
      required:
      - '@type'
      - name
    Quantity:
      type: object
      description: An amount in a given unit
      properties:
        amount:
          type: number
          format: float
          description: Numeric value in a given unit
        units:
          type: string
          description: Unit
    RelatedParty:
      type: object
      description: Related Entity reference. A related party defines party or party role linked to a specific entity.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        name:
          type: string
          description: Name of the related entity.
        role:
          type: string
          description: Role played by the related party
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - '@referredType'
      - id
    RelatedPlace:
      type: object
      description: A  Place and an associated role as installation adress, delivery address, etc....
      properties:
        id:
          type: string
          description: Unique identifier of the place
        href:
          type: string
          format: uri
          description: Unique reference of the place
        name:
          type: string
          description: A user-friendly name for the place, such as [Paris Store], [London Store], [Main Home]
        role:
          type: string
          description: 'Role of the place, such as: [home delivery], [shop retrieval])'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        endDateTime:
          type: string
          format: date-time
          description: End of the time period, using IETC-RFC-3339 format
          example: 1985-04-12 23:20:50.520000+00:00
        startDateTime:
          type: string
          format: date-time
          description: Start of the time period, using IETC-RFC-3339 format
          example: 1985-04-12 23:20:50.520000+00:00
    Error:
      type: object
      properties:
        code:
          type: string
        reason:
          type: string
        message:
          type: string
        status:
          type: string
        referenceError:
          type: string
          format: uri
        baseType:
          type: string
        schemaLocation:
          type: string
        type:
          type: string
    AccountPaymentMethod_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      required:
      - '@type'
    BankAccountDebit_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      - type: object
        properties:
          accountNumber:
            type: string
            description: The Bank Account Number (this could refer to the IBAN or SWIFT number)
          accountNumberType:
            type: string
            description: 'The type of account number (e.g.: IBAN, SWIFT, ...)'
          BIC:
            type: string
            description: The Business Identifier Code/Swift code of the financial institution where the account is located.
          owner:
            type: string
            description: The owner of the bank account. This is also the account name.
          bank:
            type: string
            description: The display name of the bank.
      description: A bank account debit method of payment. This could be extended to add any required authorization fields
        to allow recurring payments
      required:
      - '@type'
    BankAccountTransfer_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      - type: object
        properties:
          accountNumber:
            type: string
            description: The bank account number, this could refer to the iban or swift number.
          accountNumberType:
            type: string
            description: 'The type of account number (e.g.: IBAN, SWIFT, ...)'
          BIC:
            type: string
            description: The Business Identifier Code/Swift code of the financial institution where the account is located.
          owner:
            type: string
            description: The owner of the bank account. This is also the account name.
          bank:
            type: string
            description: The display name of the bank.
      description: A bank transfer method of payment.
      required:
      - '@type'
    BankCard_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      - type: object
        properties:
          brand:
            type: string
            description: The card brand
          cardType:
            type: string
            description: The type of card e.g. Credit, debit etc.
          cardNumber:
            type: string
            description: The bank card number.
          expirationDate:
            type: string
            format: date-time
            description: Expiration date of the bank card.
          cvv:
            type: string
            description: 'The security code (e.g.: CVV, CVV2) of the card.'
          lastFourDigits:
            type: string
            description: The last four digits of the credit card.
          nameOnCard:
            type: string
            description: The name on the card.
          bank:
            type: string
            description: The bank that issued the card.
      description: A bank card method of payment.
      required:
      - '@type'
    BucketPaymentMethod_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      required:
      - '@type'
    Cash_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      description: 'A cash method of payment. It has no additional data, but it could be extended to add information e.g.:
        the cashier who took the payment, the person who paid, etc'
      required:
      - '@type'
    Check_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      - type: object
        properties:
          checkId:
            type: string
            description: Unique identifier of the check.
          drawer:
            type: string
            description: Person or entity writing the check.
          payee:
            type: string
            description: Person or entity the check is addressed to.
          signedDate:
            type: string
            format: date-time
            description: Date when the check was signed.
          bank:
            type: string
            description: Bank performing the payment of the check.
      description: A check method of payment.
      required:
      - '@type'
    DigitalWallet_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      - type: object
        properties:
          service:
            type: string
            description: 'Organization, platform or currency backing the wallet (e.g.: PayPal, Yandex, BitCoin…).'
          walletId:
            type: string
            description: Account identifier in that service.
          walletUrl:
            type: string
            description: 'URI pointing at the digital wallet (e.g.: //paypal.me/johndoe).'
      description: A digital wallet method of payment.
      required:
      - '@type'
    DirectDebit_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      - type: object
        properties:
          mandateId:
            type: string
            description: Unique mandate reference
          mandateStatus:
            type: string
            description: The status of the mandate(Active/Inactive/Pending)
          mandateType:
            type: string
            description: The type of mandate e.g., single-use(single)/multi-use(recurring)
          mandateCategory:
            type: string
            description: The identification code of the Scheme e.g., core/b2b
          signature:
            type: string
            description: The (e)Mandate electronic signature data
          signatureDate:
            type: string
            format: date-time
            description: The date of signing of the (e)Mandate
          mandateStatusDate:
            type: string
            format: date-time
            description: The date of the mandate status change
          firstDebitDate:
            type: string
            format: date-time
            description: The first debit date. The debit date of the collection is the day when the payment of the Debtor
              is due to the Creditor
          lastDebitDate:
            type: string
            format: date-time
            description: The last debit date. The debit date of the collection is the day when the payment of the Debtor is
              due to the Creditor
          cancellationDate:
            type: string
            format: date-time
            description: The date on which the (e)Mandate has been cancelled by the Debtor or the Creditor.
          accountNumber:
            type: string
            description: The bank account number, this could refer to the iban or swift number.
          accountNumberType:
            type: string
            description: 'The type of account number (e.g.: IBAN, SWIFT, ...)'
          reference:
            type: string
            description: A reference that the party can later use to identify the direct debit.
          BIC:
            type: string
            description: The Business Identifier Code/Swift code of the financial institution where the account is located.
          owner:
            type: string
            description: The owner of the bank account. This is also the account name.
          bank:
            type: string
            description: The display name of the bank.
          attachment:
            type: array
            description: attachment
            items:
              $ref: '#/components/schemas/AttachmentRefOrValue'
      description: Direct Debit is a fully automated payment instrument which is generally used for recurrent payments. It
        allows a creditor to initiate the payment order. In doing so, it exempts the debtor from having to send a separate
        payment order at each due date
      required:
      - '@type'
    LoyaltyPaymentMethod_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
