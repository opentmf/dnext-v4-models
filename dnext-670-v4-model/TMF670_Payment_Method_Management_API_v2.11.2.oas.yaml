    PaymentMethod_Create:
      type: object
      description: 'Defines a specific method of payment (e.g. direct debit with all details associated) Skipped properties:
        id,href'
      discriminator:
        propertyName: '@type'
      properties:
        authorizationCode:
          type: string
          description: 'Review: Authorization code provided by a financial institution. Typically this would be populated
            for recurring payments using the method, as payments have an authorization code of their own.'
          example: 1234567890
        description:
          type: string
          description: Text description of the contents of the payment method
          example: My gold mastercard.
        isPreferred:
          type: boolean
          description: If the method is the preferred one by the owner. Typically used when querying for the payment methods
            of a specific customer or account
          example: true
        status:
          type: string
          description: Status of the payment method
          example: Active
        statusDate:
          type: string
          format: date-time
          description: The last time the payment method status changed.
          example: 1985-04-12 23:20:50.520000+00:00
        statusReason:
          type: string
          description: The reason for the last status change.
          example: This payment method has expired, therefore its status is now inactive.
        account:
          type: array
          description: Reference to the accounts that are linked to the payment method. May be a party account or a financial
            account.
          items:
            $ref: '#/components/schemas/AccountRef'
        relatedParty:
          $ref: '#/components/schemas/RelatedParty'
          description: Reference to the customer or party that owns that payment method or can use it.
        relatedPlace:
          $ref: '#/components/schemas/RelatedPlace'
          description: Reference to a place for billing or delivery address, if different to that of the related party.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: Date interval in which the payment method is valid
        id:
          type: string
          description: unique identifier
        name:
          type: string
          description: Friendly name assigned to the payment method
          example: Main credit card
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@type':
          type: string
          description: 'Type of payment method (e.g.: bank card, cash, voucher, etc). The details field type depends on the
            value assigned to this one.'
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
      required:
      - '@type'
    TokenizedCard_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      - type: object
        properties:
          brand:
            type: string
            description: Card brand. Might be used for display purposes
          cardType:
            type: string
            description: Card type. Might be used for display purposes.
          lastFourDigits:
            type: string
            description: The last four digits of the credit card.
          tokenType:
            type: string
            description: 'Token type (e.g.: emv).'
          token:
            type: string
            description: The token. A series of randomly generated numbers.
          issuer:
            type: string
            description: The entity that issued the token.
          expirationDate:
            type: string
            format: date-time
            description: The tokenized card's expiration date.
      description: A Tokenized Card method of payment.
      required:
      - '@type'
    Voucher_Create:
      allOf:
      - $ref: '#/components/schemas/PaymentMethod_Create'
      - type: object
        properties:
          code:
            type: string
            description: Code that identifies the voucher.
          value:
            $ref: '#/components/schemas/Quantity'
            description: The value of the voucher.
          discount:
            type: string
            description: The discount that the voucher applies when it's a discount voucher.
          expirationDate:
            type: string
            format: date-time
            description: The voucher's expiration date.
          campaign:
            type: string
            description: Campaign this voucher belongs to.
      description: A voucher method of payment.
      required:
      - '@type'
