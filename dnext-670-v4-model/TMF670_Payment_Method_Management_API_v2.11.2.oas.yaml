paths:
  /paymentMethod:
    get:
      tags:
      - paymentMethod
      summary: List or find PaymentMethod objects
      description: This operation list or find PaymentMethod entities
      operationId: listPaymentMethod
      parameters:
      - name: fields
        in: query
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Requested index for start of resources to be provided in response
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        description: Requested number of resources to be provided in response
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        description: Sort field of resources to be provided in response
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - paymentMethod
      summary: Creates a PaymentMethod
      description: This operation creates a PaymentMethod entity.
      operationId: createPaymentMethod
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              description: The PaymentMethod to be created
              oneOf:
              - $ref: '#/components/schemas/AccountPaymentMethod_Create'
              - $ref: '#/components/schemas/BankAccountDebit_Create'
              - $ref: '#/components/schemas/BankAccountTransfer_Create'
              - $ref: '#/components/schemas/BankCard_Create'
              - $ref: '#/components/schemas/BucketPaymentMethod_Create'
              - $ref: '#/components/schemas/Cash_Create'
              - $ref: '#/components/schemas/Check_Create'
              - $ref: '#/components/schemas/DigitalWallet_Create'
              - $ref: '#/components/schemas/DirectDebit_Create'
              - $ref: '#/components/schemas/LoyaltyPaymentMethod_Create'
              - $ref: '#/components/schemas/Other_Create'
              - $ref: '#/components/schemas/TokenizedCard_Create'
              - $ref: '#/components/schemas/Voucher_Create'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /hub:
    post:
      tags:
      - events subscription
      summary: Register a listener
      description: Sets the communication endpoint address the service instance must use to deliver information about its
        health state, execution state, failures and metrics.
      operationId: registerListener
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/EventSubscriptionInput'
        required: true
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscription'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /paymentMethod/{id}:
    get:
      tags:
      - paymentMethod
      summary: Retrieves a PaymentMethod by ID
      description: This operation retrieves a PaymentMethod entity. Attribute selection is enabled for all first level attributes.
      operationId: retrievePaymentMethod
      parameters:
      - name: id
        in: path
        description: Identifier of the PaymentMethod
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - paymentMethod
      summary: Deletes a PaymentMethod
      description: This operation deletes a PaymentMethod entity.
      operationId: deletePaymentMethod
      parameters:
      - name: id
        in: path
        description: Identifier of the PaymentMethod
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - paymentMethod
      summary: Partially updates a PaymentMethod
      description: This operation partially updates a PaymentMethod entity.
      operationId: patchPaymentMethod
      parameters:
      - name: id
        in: path
        description: Identifier of the PaymentMethod
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/PaymentMethod_Update'
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
