        '500':
          description: Internal Server Error
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    EventSubscriptionInput:
      type: object
      description: Data containing the callback endpoint to deliver the information
      properties:
        callback:
          type: string
          description: The callback being registered.
          minLength: 1
        query:
          type: string
          description: additional data to be passed
      required:
      - callback
    EventSubscription:
      type: object
      description: Sets the communication endpoint address the service instance must use to deliver notification information
      properties:
        revision:
          type: integer
          description: Version number of the entity
        createdDate:
          type: string
          format: date-time
          description: Date of creation
        updatedDate:
          type: string
          format: date-time
          description: Date of update
        createdBy:
          type: string
          description: Name of created by user
        updatedBy:
          type: string
          description: Name of updated by user
        id:
          type: string
          description: Id of the listener
          minLength: 1
        callback:
          type: string
          description: The callback being registered.
          minLength: 1
        query:
          type: string
          description: additional data to be passed
      required:
      - callback
      - id
    Error:
      type: object
      properties:
        code:
          type: string
        reason:
          type: string
        message:
          type: string
        status:
          type: string
        referenceError:
          type: string
          format: uri
        baseType:
          type: string
        schemaLocation:
          type: string
        type:
          type: string
    AccountRef:
      type: object
      description: Account reference. A account may be a party account or a financial account.
      properties:
        id:
          type: string
        href:
          type: string
          format: uri
          description: Reference of the resource
        description:
          type: string
          description: Detailed description of the account
        name:
          type: string
          description: Name of the account
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - name
    AclRelatedParty:
      type: object
      description: Related Entity reference. A related party defines party or party role linked to a specific entity.
      properties:
        id:
          type: string
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the related entity.
        role:
          type: string
          description: Role played by the related party
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - '@referredType'
    AgreementRef:
      type: object
      description: Agreement reference. An agreement represents a contract or arrangement, either written or verbal and sometimes
        enforceable by law, such as a service level agreement or a customer price agreement. An agreement involves a number
        of other business entities, such as products, services, and resources and/or their specifications.
      properties:
        id:
          type: string
        href:
          type: string
          format: uri
          description: Reference of the resource
        name:
          type: string
          description: Name of the agreement
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference. An attachment complements the description of an element, for example
        through a document, a video, a picture.
      properties:
        id:
          type: string
          description: Unique identifier of a attachment.
        href:
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          description: The actual contents of the attachment object, if embedded, encoded as base64
        description:
          type: string
          description: A narrative text describing the content of the attachment
        documentType:
          type: string
          description: The type of the document
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: '#/components/schemas/Quantity'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a name/value pair.
      properties:
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        value:
          description: The value of the characteristic
          $ref: '#/components/schemas/Any'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - name
      - value
    ContactMedium:
      type: object
      description: Indicates the contact medium that could be used to contact the party.
      properties:
        mediumType:
          type: string
          description: 'Type of the contact medium, such as: email address, telephone number, postal address'
        preferred:
          type: boolean
          description: If true, indicates that is the preferred contact medium
        characteristic:
          $ref: '#/components/schemas/MediumCharacteristic'
          description: Any additional characteristic(s) of this contact medium
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The time period that the contact medium is valid for
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - characteristic
      - mediumType
    CreditProfile:
      type: object
      description: Credit profile for the party (containing credit scoring, ...). By default only the current credit profile  is
        retrieved. It can be used as a list to give the party credit profiles history, the first one in the list will be the
        current one.
      properties:
        creditProfileDate:
          type: string
          format: date-time
          description: The date the profile was established
        creditRiskRating:
          type: integer
          description: This is an integer whose value is used to rate the risk
        creditScore:
          type: integer
          description: A measure of a person or organizations creditworthiness calculated on the basis of a combination of
            factors such as their income and credit history
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period for which the profile is valid
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - creditProfileDate
      - validFor
    Customer_Create:
      type: object
      description: The Customer to be created
      properties:
        status:
          type: string
          description: Used to track the lifecycle status of the customer
        statusReason:
          type: string
          description: A string providing an explanation on the value of the status lifecycle
        account:
          type: array
          description: A list of account references
          items:
            $ref: '#/components/schemas/AccountRef'
        agreement:
          type: array
          description: A list of agreement references
          items:
            $ref: '#/components/schemas/AgreementRef'
        attachment:
          type: array
          description: A list of attachment references
          items:
            $ref: '#/components/schemas/AttachmentRefOrValue'
        characteristic:
          type: array
          description: A list of characteristics
          items:
            $ref: '#/components/schemas/Characteristic'
        contactMedium:
          type: array
          description: A list of contact mediums
          items:
            $ref: '#/components/schemas/ContactMedium'
        creditProfile:
          type: array
          description: A list of credit profiles
          items:
            $ref: '#/components/schemas/CreditProfile'
        paymentMethod:
          type: array
          description: A list of payment method references
          items:
            $ref: '#/components/schemas/PaymentMethodRef'
        relatedParty:
          type: array
          description: A list of related parties (RelatedParty [*]). Related Entity reference. A related party defines party
            or party role linked to a specific entity
          items:
            $ref: '#/components/schemas/RelatedParty'
        externalReference:
          type: array
          description: A list of external references
          items:
            $ref: '#/components/schemas/ExternalReference'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: A time period. The time period that the Customer is valid for
        aclRelatedParty:
          type: array
          items:
            $ref: '#/components/schemas/AclRelatedParty'
        id:
          type: string
          description: Unique identifier of the customer
        name:
          type: string
          description: Name of the customer
        engagedParty:
          $ref: '#/components/schemas/RelatedParty'
          description: A related party (RelatedParty). The party - an organization or an individual - that is engaged as a
            customer
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - engagedParty
      - name
    ExternalReference:
      type: object
      description: External reference of the individual or reference in other system
      properties:
        id:
          type: string
          description: unique identifier.
        href:
          type: string
          format: uri
          description: Hyperlink reference.
        externalReferenceType:
          type: string
          description: Type of the external reference
        name:
          type: string
          description: External reference name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
      required:
      - id
    MediumCharacteristic:
      type: object
      description: Describes the contact medium characteristics that could be used to contact a party (an individual or an
        organization)
      properties:
        city:
          type: string
          description: The city
        contactType:
          type: string
          description: 'The type of contact, for example: phone number such as mobile, fixed home, fixed office. postal address
            such as shipping instalation…'
        country:
          type: string
          description: The country
        emailAddress:
          type: string
          description: Full email address in standard format
        faxNumber:
          type: string
          description: The fax number of the contact
        phoneNumber:
          type: string
          description: The primary phone number of the contact
        postCode:
          type: string
          description: Postcode
        socialNetworkId:
