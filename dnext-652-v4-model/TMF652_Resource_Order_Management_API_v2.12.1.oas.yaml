          type: string
          description: constraint version
        '@referredType':
          type: string
          description: The (class) type of the referred constraint
      required:
      - id
    ExternalId:
      type: object
      description: An identification of an entity that is owned by or originates in a software system different from the current
        system, for example a ProductOrder handed off from a commerce platform into an order handling system. The structure
        identifies the system itself, the nature of the entity within the system (e.g. class name) and the unique ID of the
        entity within the system. It is anticipated that multiple external IDs can be held for a single entity, e.g. if the
        entity passed through multiple systems on the way to the current system. In this case the consumer is expected to
        sequence the IDs in the array in reverse order of provenance, i.e. most recent system first in the list.
      properties:
        id:
          type: string
          description: ID of the entity within the external system.
        entityType:
          type: string
          description: Type of the entity within the external system
        owner:
          type: string
          description: Name of the external system that owns the entity.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - entityType
      - id
      - owner
    ExternalReference:
      type: object
      description: External reference of the individual or reference in other system
      properties:
        id:
          type: string
          description: Id of the external reference
        href:
          type: string
          format: uri
          description: Link for external reference
        externalReferenceType:
          type: string
          description: Type of the external reference
        name:
          type: string
          description: External reference name
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - name
