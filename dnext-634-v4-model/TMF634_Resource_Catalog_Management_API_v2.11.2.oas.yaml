    ResourceSpecificationRef:
      type: object
      description: Resources are physical or non-physical components (or some combination of these) within an enterprise's
        infrastructure or inventory. They are typically consumed or used by services (for example a physical port assigned
        to a service) or contribute to the realization of a Product (for example, a SIM card). They can be drawn from the
        Application, Computing and Network domains, and include, for example, Network Elements, software, IT systems, content
        and information, and technology components. A ResourceSpecification is an abstract base class for representing a generic
        means for implementing a particular type of Resource. In essence, a ResourceSpecification defines the common attributes
        and relationships of a set of related Resources, while Resource defines a specific instance that is based on a particular
        ResourceSpecification.
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the related entity.
        version:
          type: string
          description: Resource Specification version
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
      - href
      - id
    ResourceSpecificationRelationship:
      type: object
      description: A migration, substitution, dependency or exclusivity relationship between/among resource specifications.
      properties:
        id:
          type: string
          description: Unique identifier of target ResourceSpecification
        href:
          type: string
          format: uri
          description: Reference of the target ResourceSpecification
        defaultQuantity:
          type: integer
          description: The default number of the related resource that should be instantiated, for example a rack would typically
            have 4 cards, although it could support more.
        maximumQuantity:
          type: integer
          description: The maximum number of the related resource that should be instantiated, for example a rack supports
            a maximum of 16 cards
        minimumQuantity:
          type: integer
          description: The minimum number of the related resource that should be instantiated, for example a rack must have
            at least 1 card
        name:
          type: string
          description: The name given to the target resource specification instance
        version:
          type: string
          description: The version given to the target resource specification instance
        relationshipType:
          type: string
          description: Type of relationship such as migration, substitution, dependency, exclusivity
        role:
          type: string
          description: The association role for this resource specification
        characteristic:
          type: array
          description: A characteristic that refines the relationship. For example, consider the relationship between a slot
            and a card. For a half-height card it is important to know the position at which the card is inserted, so a characteristic
            Position might be defined on the relationship to allow capturing of this in the inventory
          items:
            $ref: '#/components/schemas/ResourceSpecificationCharacteristic'
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: The period for which the ResourceSpecRelationship is valid
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
      required:
      - href
      - id
      - relationshipType
