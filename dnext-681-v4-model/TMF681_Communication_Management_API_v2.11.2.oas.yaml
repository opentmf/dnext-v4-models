          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CommunicationMessage:
      type: object
      description: 'Communication message means a notification approach in the format of a message which can be dispatched
        (sent) to the certain user by the system with the content which can be felt and understood by the recipient. The user
        can be either a final customer or a customer service agent. The message can reach the customer in different interaction
        channels, including: email, short message, mobile app notification (push).'
      properties:
        revision:
          type: integer
          description: Version number of the entity
        createdDate:
          type: string
          format: date-time
          description: Date of creation
        updatedDate:
          type: string
          format: date-time
          description: Date of update
        createdBy:
          type: string
          description: Name of created by user
        updatedBy:
          type: string
          description: Name of updated by user
        id:
          type: string
          description: Unique identifier of Communication Message
        href:
          type: string
          format: uri
          description: Hypertext Reference of the Communication Message
        content:
          type: string
          description: The content of the communication message
        description:
          type: string
          description: Description for the whole object
        logFlag:
          type: boolean
        messageType:
          type: string
          description: 'The type of message, such as: SMS, Email, Mobile app push notification'
          enum:
          - email
          - sms
          - applePushNotification
          - googleFirebaseCloudMessaging
        priority:
          type: string
          description: The priority of the communication message. Small number means higher priority.
        scheduledSendTime:
          type: string
          format: date-time
          description: The scheduled time for sending the communication message
        sendTime:
          type: string
          format: date-time
          description: The time of sending communication message
        sendTimeComplete:
          type: string
          format: date-time
          description: The time of completion of sending communication message
        subject:
          type: string
          description: The title of the message, necessary for the email and mobile app push
        tryTimes:
          type: integer
          description: How many times do you want to retry the delivery of this message?
        attachment:
          type: array
          description: Any attachment associated with this message
          items:
            $ref: '#/components/schemas/Attachment'
        characteristic:
          type: array
          description: Any additional characteristic(s) of this message
          items:
            $ref: '#/components/schemas/Characteristic'
        receiver:
          type: array
          description: The receiver(s) of this message
          items:
            $ref: '#/components/schemas/Receiver'
        sender:
          $ref: '#/components/schemas/Sender'
          description: The sender of this message
        state:
          type: string
          description: Status of communication message
          enum:
          - initial
          - inProgress
          - completed
          - cancelled
          - failed
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class entity name
        aclRelatedParty:
          type: array
          description: DNext Access-Control RelatedParty List like ownership etc.
          items:
            $ref: '#/components/schemas/RelatedParty'
    CommunicationMessageAttributeValueChangeEvent:
      type: object
